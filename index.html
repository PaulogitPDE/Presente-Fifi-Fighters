<script>
  // no celular (ou abrindo o link do QR code) mostra só o controle; ?jogo=1 força o jogo
  (function () {
    var q = location.search;
    if (/[?&]jogo=1/.test(q)) return;
    var mob = /Android|iPhone|iPod|Mobile/i.test(navigator.userAgent);
    if (mob || /[?&]c=/.test(q)) location.replace('controle.html' + q);
  })();
</script>
